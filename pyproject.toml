[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
select = [
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
    "UP",  # pyupgrade
]
ignore = [
    "D1",   # pydocstyle undocumented-something
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

# Same as Black.
line-length = 100
target-version = "py312"
