[project]
name = "ad-infra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.2.1",
    "jinja2>=3.1.6",
    "netaddr>=1.3.0",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
select = [
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
    "UP",  # pyupgrade
]
ignore = [
    "D1",   # pydocstyle undocumented-something
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

# Same as Black.
line-length = 100
target-version = "py313"
