---
- name: Create directory for cofniguration files
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ service_registry_remote_path }}"
    state: directory
    owner: "{{ ansible_user }}"

- name: Copy configuration files
  ansible.posix.synchronize:
    src: "{{ service_registry_local_path + '/' }}"
    dest: "{{ service_registry_remote_path }}"
    mode: push
    use_ssh_args: true
    archive: true
    compress: true
    recursive: true
    perms: true
  register: registry_service

- name: Run services with docker compose
  ansible.builtin.shell:
    chdir: "{{ service_registry_remote_path }}"
    cmd: docker compose up --build -d
  environment:
    DOCKER_BUILDKIT: "1"
