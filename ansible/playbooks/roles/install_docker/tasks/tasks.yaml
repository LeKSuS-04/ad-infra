---
- name: Ensure no conflicting packages exist on the system
  ansible.builtin.apt:
    pkg:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent
    update_cache: yes

- name: Install dependencies
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Download docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: 0644
    force: yes
  register: gpg_download

- name: Get DEB architecture
  ansible.builtin.shell: dpkg --print-architecture
  register: deb_architecture

- name: Add docker repository into sources list
  ansible.builtin.apt_repository:
    repo: |
      deb [arch={{ deb_architecture.stdout }} signed-by={{ gpg_download.dest }}]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
    filename: docker.list
    update_cache: yes

- name: Install docker
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add ansible user to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    append: yes
    groups: docker
    state: present
  loop: "{{ query('list', docker_users) }}"

- name: Reload SSH connection to apply group changes
  ansible.builtin.meta: reset_connection

- name: Make sure docker service is running and enable autostart on boot
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - docker.service
    - containerd.service
