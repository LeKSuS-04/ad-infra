---
- name: Configure jury host
  hosts: jury
  roles:
    - name: Install docker engine
      role: install_docker

    - name: Connect to game network
      role: connect_vpn_client
      vars:
        vpn_client_config_local_path: "{{ vpn_client_file }}"

    - name: Start ForcAD
      role: start_forcad
      vars:
        forcad_config_local_path: "{{ forcad_config_file }}"
        checkers_local_path: "{{ checkers_path }}"
